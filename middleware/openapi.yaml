openapi: 3.1.0
info:
  title: bookLister API
  description: API for the bookLister application, which allows one to keep track of the books one has read
  license:
    name: BSD-3 Clause
    url: https://opensource.org/license/BSD-3-clause
  version: 0.0.5
servers:
  - url: https://localhost:{port}/{basePath}
    description: localhost
    variables:
      port:
        enum:
          - "8080"
        default: "8080"
        description: what port the API is running on
      basePath:
        default: "api"
tags:
  - name: Health
    description: Collect of endpoints for the health of the application
paths:
  /healthcheck:
    get:
      operationId: bookListerHealthCheck
      summary: Ensure BookLister API is running
      tags:
        - Health
      security: []
      parameters:
        - in: header
          name: X-API-Version
          description: Indicates the which version of the API that should be used
          schema:
            type: string
            default: v1
            examples:
              - v1
              - v2
      responses:
        "200":
          description: BookLister API is up and running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
              example:
                status: RUNNING
        "503":
          description: Bookister API has something wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
              example:
                status: DOWN
components:
  schemas:
    HealthCheckResponse:
      type: object
      description: Response Body for the Health Check API
      required:
        - status
      status:
        type: string
        enum: ["RUNNING", "DOWN"]
      examples:
        - status: RUNNING
        - status: DOWN
