name: CI Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test booklister
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bookLister
        uses: actions/checkout@6

      - name: Setup JDK 26
        uses: actions/setup-java@5
        with:
          distribution: temurin
          java-version: "26"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew Runnable
        working-directory: middleware
        run: chmod +x gradlew

      - name: Build bookLister
        working-directory: middleware
        run: ./gradlew build -x test

      - name: Run bookLister tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report for bookLister
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 90
          title: "## Test Coverage Report"
          update-comment: true
